[project]
name = "toonbox"
version = "3.4.0"
description = "Audio + saved cartoon characters -> simple 2D cartoon video, fully local."
requires-python = ">=3.11,<3.13"
dependencies = [
  "gradio>=6.0,<7",
  "numpy",
  "pillow>=10",
  "scipy",
  "scikit-learn",
  "imageio-ffmpeg",
  "faster-whisper>=1.1",
  "sherpa-onnx>=1.12",
  "skia-python>=138",
  "anthropic",
]

[tool.uv]
package = false
